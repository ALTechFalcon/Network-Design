<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Four-segment lab network behind one default-deny firewall" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="420" fill="#fff"/>
<text x="24" y="28" font-size="15" font-weight="600">Four segments, one default-deny firewall, no route to the Internet</text>
<rect x="290" y="150" width="180" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="380" y="178" text-anchor="middle" font-weight="600">Firewall VM</text>
<text x="380" y="198" text-anchor="middle" font-size="11.5">default deny, logs drops</text>
<g stroke="#555" stroke-width="1.5" fill="none"><path d="M380 150V110"/><path d="M290 185H190"/><path d="M470 185H570"/><path d="M380 220V260"/></g>
<rect x="250" y="50" width="260" height="60" rx="8" fill="none" stroke="#555"/>
<text x="380" y="74" text-anchor="middle" font-weight="600">Mgmt 10.10.40.0/24</text><text x="380" y="94" text-anchor="middle" font-size="11.5">mgmt-host only, tcp 443 to firewall</text>
<rect x="30" y="150" width="160" height="70" rx="8" fill="none" stroke="#555"/>
<text x="110" y="176" text-anchor="middle" font-weight="600">Users 10.10.10.0/24</text><text x="110" y="196" text-anchor="middle" font-size="11.5">analyst-ws</text>
<rect x="570" y="150" width="160" height="70" rx="8" fill="none" stroke="#555"/>
<text x="650" y="176" text-anchor="middle" font-weight="600">Servers 10.10.20.0/24</text><text x="650" y="196" text-anchor="middle" font-size="11.5">log-collector, file-server</text>
<rect x="250" y="260" width="260" height="80" rx="8" fill="#fff8e1" stroke="#b9770e" stroke-width="2"/>
<text x="380" y="286" text-anchor="middle" font-weight="600">Lab 10.10.30.0/24 (untrusted)</text><text x="380" y="306" text-anchor="middle" font-size="11.5">linux-target, web-target</text><text x="380" y="324" text-anchor="middle" font-size="11.5">Users in: 22, 80, 443 · syslog out: udp 514</text>
<text x="24" y="392" font-size="11.5" fill="#555">Lab to Internet: denied (rule 5). Lab to Users: denied (rule 4). Everything unlisted: denied (rule 7).</text>
</svg>
